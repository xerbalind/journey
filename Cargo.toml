[package]
name = "journey-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = {version = "0.4.45", features = ["serde"]}
deadpool-diesel = { version = "0.7.0", features = ["postgres"] }
diesel = {version = "2.3.14", features = ["postgres","chrono"]}
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = {version = "1.53.2", features = ["full"]}
tower-http = { version = "0.7.1", features = ["cors", "fs"] }

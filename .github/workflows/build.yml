name: Docker main build and push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-main
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build . \
            -t ghcr.io/xerbalind/journey:${{ github.sha }} \
            -t ghcr.io/xerbalind/journey:latest
          docker push --all-tags ghcr.io/xerbalind/journey
